name: Refresh profile assets

on:
  schedule:
    - cron: "30 18 * * *" # daily, after the 3D city job
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull live numbers (repos, followers, stars)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: node scripts/fetch-stats.mjs

      - name: Rebuild SVGs and README
        run: node scripts/build.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md data
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "chore: refresh dashboard numbers"
          git push
